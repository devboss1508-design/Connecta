<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#22C55E"
  >

  <title>Profile — CONNECTA</title>

  <link rel="stylesheet" href="css/main.css">

  <style>

    /* ========================================
       CONNECTA PROFILE
    ======================================== */

    .profile-page {
      min-height: 100vh;
      background: #f7faf7;
      padding-bottom: 30px;
    }

    /* ========================================
       HEADER
    ======================================== */

    .profile-header {
      height: 64px;
      background: var(--primary);
      color: #fff;

      display: flex;
      align-items: center;

      padding: 0 14px;
      gap: 10px;

      position: sticky;
      top: 0;
      z-index: 20;

      box-shadow:
        0 4px 15px rgba(21,128,61,.18);
    }

    .profile-back {
      width: 42px;
      height: 42px;

      border: 0;
      background: transparent;

      color: #fff;

      display: grid;
      place-items: center;

      font-size: 27px;
      border-radius: 12px;

      cursor: pointer;
    }

    .profile-back:active {
      background: rgba(255,255,255,.15);
    }

    .profile-header-title {
      font-size: 19px;
      font-weight: 900;
    }

    /* ========================================
       PROFILE CONTAINER
    ======================================== */

    .profile-container {
      width: 100%;
      max-width: 650px;

      margin: 14px auto;

      padding: 0 12px;
    }

    /* ========================================
       PROFILE CARD
    ======================================== */

    .profile-card {
      background: #fff;

      border: 1px solid #e1e9e3;
      border-radius: 24px;

      overflow: hidden;

      box-shadow:
        0 5px 18px rgba(31,41,55,.06);
    }

    /* ========================================
       COVER
    ======================================== */

    .profile-cover {
      height: 125px;

      background:
        linear-gradient(
          135deg,
          #22c55e,
          #16a34a
        );

      position: relative;
    }

    /* ========================================
       AVATAR
    ======================================== */

    .profile-avatar-wrap {
      position: relative;

      width: 106px;
      height: 106px;

      margin: -53px auto 0;

      z-index: 3;
    }

    .profile-avatar {
      width: 106px;
      height: 106px;

      border-radius: 50%;

      background: #baf0ca;

      border: 5px solid #fff;

      display: grid;
      place-items: center;

      color: #08752f;

      font-size: 32px;
      font-weight: 900;

      overflow: hidden;

      box-shadow:
        0 4px 15px rgba(0,0,0,.12);
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ========================================
       PROFILE INFO
    ======================================== */

    .profile-info {
      text-align: center;

      padding: 10px 18px 20px;
    }

    .profile-name {
      display: flex;

      justify-content: center;
      align-items: center;

      gap: 5px;

      margin-top: 4px;

      font-size: 22px;
      font-weight: 900;

      color: #17201b;
    }

    /* ========================================
       BLUE VERIFIED BADGE
    ======================================== */

    .verified-badge {
      width: 20px;
      height: 20px;
      min-width: 20px;

      border-radius: 50%;

      background: #1d9bf0;

      color: #fff;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      font-size: 12px;
      font-weight: 900;

      line-height: 1;

      box-shadow:
        0 1px 3px rgba(0,0,0,.15);
    }

    .profile-username {
      margin-top: 4px;

      color: #66706a;

      font-size: 13px;
    }

    .profile-status {
      display: flex;

      justify-content: center;
      align-items: center;

      gap: 5px;

      margin-top: 8px;

      font-size: 12px;
      font-weight: 700;
    }

    .profile-status.online {
      color: #16a34a;
    }

    .profile-status.offline {
      color: #9ca3af;
    }

    .profile-status-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      display: inline-block;
    }

    .profile-status-dot.online {
      background: #22c55e;

      box-shadow:
        0 0 0 3px rgba(34,197,94,.12);
    }

    .profile-status-dot.offline {
      background: #9ca3af;
    }

    /* ========================================
       BIO
    ======================================== */

    .profile-bio {
      margin: 12px auto 0;

      max-width: 420px;

      color: #66706a;

      font-size: 13px;
      line-height: 1.5;
    }

    /* ========================================
       STATS
    ======================================== */

    .profile-stats {
      display: grid;

      grid-template-columns: 1fr 1fr;

      border-top: 1px solid #edf1ee;
      border-bottom: 1px solid #edf1ee;

      margin-top: 18px;
    }

    .profile-stat {
      text-align: center;

      padding: 14px 8px;
    }

    .profile-stat + .profile-stat {
      border-left: 1px solid #edf1ee;
    }

    .profile-stat strong {
      display: block;

      font-size: 18px;
      font-weight: 900;

      color: #17201b;
    }

    .profile-stat span {
      display: block;

      margin-top: 2px;

      color: #7b847f;

      font-size: 11px;
    }

    /* ========================================
       ACTIONS
    ======================================== */

    .profile-actions {
      padding: 17px 18px 4px;

      display: grid;
      gap: 9px;
    }

    .profile-chat-btn,
    .profile-edit-btn,
    .profile-verify-btn {
      width: 100%;

      min-height: 46px;

      border: 0;
      border-radius: 24px;

      color: #fff;

      font-size: 14px;
      font-weight: 900;

      cursor: pointer;

      transition: .15s;
    }

    .profile-chat-btn {
      background: var(--primary);
    }

    .profile-edit-btn {
      background: #eefbf1;
      color: var(--primary-dark);
    }

    .profile-verify-btn {
      background: #1d9bf0;
    }

    .profile-chat-btn:active,
    .profile-edit-btn:active,
    .profile-verify-btn:active {
      transform: scale(.98);
    }

    .profile-verify-btn:disabled {
      opacity: .65;
      cursor: not-allowed;
      transform: none;
    }

    .profile-verified-message {
      margin-top: 8px;

      padding: 9px 12px;

      border-radius: 12px;

      background: #eef7ff;

      color: #1769aa;

      font-size: 12px;
      font-weight: 700;

      text-align: center;
    }

    /* ========================================
       STORIES AREA
    ======================================== */

    .profile-section {
      margin-top: 12px;

      background: #fff;

      border: 1px solid #e1e9e3;
      border-radius: 22px;

      padding: 16px;

      box-shadow:
        0 4px 14px rgba(31,41,55,.05);
    }

    .profile-section-title {
      font-size: 17px;

      color: var(--primary-dark);

      font-weight: 900;
    }

    .profile-empty {
      text-align: center;

      padding: 28px 10px;

      color: #8a928d;

      font-size: 13px;
    }

    /* ========================================
       LOADING
    ======================================== */

    .profile-loading {
      min-height: 350px;

      display: grid;
      place-items: center;

      color: #7b847f;

      font-size: 14px;
    }

    /* ========================================
       ERROR
    ======================================== */

    .profile-error {
      background: #fff;

      border: 1px solid #f1d5d5;

      color: #b42318;

      border-radius: 18px;

      padding: 20px;

      text-align: center;

      font-size: 13px;
    }

    /* ========================================
       VERIFICATION MODAL
    ======================================== */

    .verification-modal {
      position: fixed;

      inset: 0;

      z-index: 100;

      display: none;

      align-items: flex-end;
      justify-content: center;

      background: rgba(0,0,0,.48);

      padding: 0;
    }

    .verification-modal.show {
      display: flex;
    }

    .verification-box {
      width: 100%;
      max-width: 520px;

      background: #fff;

      border-radius: 25px 25px 0 0;

      padding: 22px 18px 28px;

      box-shadow:
        0 -10px 35px rgba(0,0,0,.18);

      animation: verificationUp .2s ease-out;
    }

    @keyframes verificationUp {
      from {
        transform: translateY(30px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .verification-close-row {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 12px;
    }

    .verification-title {
      font-size: 19px;
      font-weight: 900;
      color: #17201b;
    }

    .verification-close {
      width: 38px;
      height: 38px;

      border: 0;

      border-radius: 50%;

      background: #f1f5f2;

      color: #47534c;

      font-size: 22px;

      cursor: pointer;
    }

    .verification-icon {
      width: 58px;
      height: 58px;

      margin: 4px auto 12px;

      border-radius: 50%;

      background: #e8f5ff;

      color: #1d9bf0;

      display: grid;
      place-items: center;

      font-size: 27px;
      font-weight: 900;
    }

    .verification-description {
      color: #66706a;

      font-size: 13px;

      line-height: 1.55;

      text-align: center;

      margin-bottom: 16px;
    }

    .verification-price {
      text-align: center;

      font-size: 26px;
      font-weight: 900;

      color: #17201b;

      margin-bottom: 17px;
    }

    .verification-price span {
      display: block;

      margin-top: 2px;

      color: #7b847f;

      font-size: 11px;

      font-weight: 600;
    }

    .verification-label {
      display: block;

      margin-bottom: 6px;

      color: #344139;

      font-size: 12px;

      font-weight: 800;
    }

    .verification-input {
      width: 100%;

      height: 48px;

      border: 1px solid #dce5df;

      border-radius: 13px;

      padding: 0 14px;

      outline: none;

      font-size: 14px;

      background: #fafcfb;
    }

    .verification-input:focus {
      border-color: #22c55e;

      box-shadow:
        0 0 0 3px rgba(34,197,94,.10);
    }

    .verification-submit {
      width: 100%;

      height: 48px;

      margin-top: 14px;

      border: 0;

      border-radius: 25px;

      background: #1d9bf0;

      color: #fff;

      font-size: 14px;

      font-weight: 900;

      cursor: pointer;
    }

    .verification-submit:disabled {
      opacity: .6;

      cursor: not-allowed;
    }

    .verification-message {
      min-height: 20px;

      margin-top: 10px;

      text-align: center;

      font-size: 12px;

      line-height: 1.45;
    }

    .verification-message.error {
      color: #dc2626;
    }

    .verification-message.success {
      color: #15803d;
    }

    .verification-message.pending {
      color: #1769aa;
    }

    /* ========================================
       MOBILE
    ======================================== */

    @media (max-width: 600px) {

      .profile-container {
        margin-top: 9px;
        padding: 0 8px;
      }

      .profile-cover {
        height: 110px;
      }

      .profile-avatar-wrap {
        width: 106px;
        min-height: 106px;
        height: 106px;

        margin: -53px auto 0;
      }

      .profile-avatar {
        width: 96px;
        height: 96px;

        font-size: 28px;
      }

      .profile-name {
        font-size: 20px;
      }

      .profile-card {
        border-radius: 20px;
      }

      .verification-modal {
        align-items: flex-end;
      }

      .verification-box {
        border-radius: 25px 25px 0 0;
      }

    }

  </style>

</head>


<body>

  <main class="profile-page">

    <!-- ========================================
         HEADER
    ======================================== -->

    <header class="profile-header">

      <button
        id="backBtn"
        class="profile-back"
        type="button"
        aria-label="Go back"
      >
        ←
      </button>

      <div class="profile-header-title">
        Profile
      </div>

    </header>


    <!-- ========================================
         PROFILE CONTENT
    ======================================== -->

    <section
      id="profileContainer"
      class="profile-container"
    >

      <div class="profile-loading">
        Loading profile...
      </div>

    </section>

  </main>


  <!-- ========================================
       VERIFY ACCOUNT MODAL
  ======================================== -->

  <div
    id="verificationModal"
    class="verification-modal"
    aria-hidden="true"
  >

    <div
      class="verification-box"
      role="dialog"
      aria-modal="true"
      aria-labelledby="verificationTitle"
    >

      <div class="verification-close-row">

        <div
          id="verificationTitle"
          class="verification-title"
        >
          Verify Account
        </div>

        <button
          id="verificationClose"
          class="verification-close"
          type="button"
          aria-label="Close"
        >
          ×
        </button>

      </div>


      <div class="verification-icon">
        ✓
      </div>


      <p class="verification-description">
        Get the blue verified badge on your CONNECTA profile.
        Verification requires a one-time payment of KSh 999.
        Your payment will be processed securely through the CONNECTA backend.
      </p>


      <div class="verification-price">
        KSh 999
        <span>One-time account verification</span>
      </div>


      <label
        class="verification-label"
        for="verificationPhone"
      >
        M-PESA phone number
      </label>


      <input
        id="verificationPhone"
        class="verification-input"
        type="tel"
        inputmode="tel"
        autocomplete="tel"
        placeholder="07XXXXXXXX"
        maxlength="15"
      >


      <button
        id="verificationSubmit"
        class="verification-submit"
        type="button"
      >
        Pay KSh 999 & Verify
      </button>


      <div
        id="verificationMessage"
        class="verification-message"
        aria-live="polite"
      ></div>

    </div>

  </div>


  <script
    type="module"
    src="js/profile.js"
  ></script>

</body>

  </html>
