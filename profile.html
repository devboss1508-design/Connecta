<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#22C55E"
  >

  <title>Profile — CONNECTA</title>

  <link rel="stylesheet" href="css/main.css">

  <style>

    /* ========================================
       CONNECTA PROFILE
    ======================================== */

    .profile-page {
      min-height: 100vh;
      background: #f7faf7;
      padding-bottom: 30px;
    }

    /* ========================================
       HEADER
    ======================================== */

    .profile-header {
      height: 64px;
      background: var(--primary);
      color: #fff;

      display: flex;
      align-items: center;

      padding: 0 14px;
      gap: 10px;

      position: sticky;
      top: 0;
      z-index: 20;

      box-shadow:
        0 4px 15px rgba(21,128,61,.18);
    }

    .profile-back {
      width: 42px;
      height: 42px;

      border: 0;
      background: transparent;

      color: #fff;

      display: grid;
      place-items: center;

      font-size: 27px;
      border-radius: 12px;

      cursor: pointer;
    }

    .profile-back:active {
      background: rgba(255,255,255,.15);
    }

    .profile-header-title {
      font-size: 19px;
      font-weight: 900;
    }

    /* ========================================
       PROFILE CONTAINER
    ======================================== */

    .profile-container {
      width: 100%;
      max-width: 650px;

      margin: 14px auto;

      padding: 0 12px;
    }

    /* ========================================
       PROFILE CARD
    ======================================== */

    .profile-card {
      background: #fff;

      border: 1px solid #e1e9e3;
      border-radius: 24px;

      overflow: hidden;

      box-shadow:
        0 5px 18px rgba(31,41,55,.06);
    }

    /* ========================================
       COVER
    ======================================== */

    .profile-cover {
      height: 125px;

      background:
        linear-gradient(
          135deg,
          #22c55e,
          #16a34a
        );

      position: relative;
    }

    /* ========================================
       AVATAR
    ======================================== */

    .profile-avatar-wrap {
      position: relative;

      width: 106px;
      height: 106px;

      margin: -53px auto 0;

      z-index: 3;
    }

    .profile-avatar {
      width: 106px;
      height: 106px;

      border-radius: 50%;

      background: #baf0ca;

      border: 5px solid #fff;

      display: grid;
      place-items: center;

      color: #08752f;

      font-size: 32px;
      font-weight: 900;

      overflow: hidden;

      box-shadow:
        0 4px 15px rgba(0,0,0,.12);
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ========================================
       PROFILE INFO
    ======================================== */

    .profile-info {
      text-align: center;

      padding: 10px 18px 20px;
    }

    .profile-name {
      display: flex;

      justify-content: center;
      align-items: center;

      gap: 5px;

      margin-top: 4px;

      font-size: 22px;
      font-weight: 900;

      color: #17201b;
    }

    .verified-badge {
      width: 19px;
      height: 19px;

      border-radius: 50%;

      background: #2196f3;

      color: #fff;

      display: inline-grid;
      place-items: center;

      font-size: 12px;
      font-weight: 900;
    }

    .profile-username {
      margin-top: 4px;

      color: #66706a;

      font-size: 13px;
    }

    .profile-status {
      display: flex;

      justify-content: center;
      align-items: center;

      gap: 5px;

      margin-top: 8px;

      font-size: 12px;
      font-weight: 700;
    }

    .profile-status.online {
      color: #16a34a;
    }

    .profile-status.offline {
      color: #9ca3af;
    }

    .profile-status-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      display: inline-block;
    }

    .profile-status-dot.online {
      background: #22c55e;

      box-shadow:
        0 0 0 3px rgba(34,197,94,.12);
    }

    .profile-status-dot.offline {
      background: #9ca3af;
    }

    /* ========================================
       BIO
    ======================================== */

    .profile-bio {
      margin: 12px auto 0;

      max-width: 420px;

      color: #66706a;

      font-size: 13px;
      line-height: 1.5;
    }

    /* ========================================
       STATS
    ======================================== */

    .profile-stats {
      display: grid;

      grid-template-columns: 1fr 1fr;

      border-top: 1px solid #edf1ee;
      border-bottom: 1px solid #edf1ee;

      margin-top: 18px;
    }

    .profile-stat {
      text-align: center;

      padding: 14px 8px;
    }

    .profile-stat + .profile-stat {
      border-left: 1px solid #edf1ee;
    }

    .profile-stat strong {
      display: block;

      font-size: 18px;
      font-weight: 900;

      color: #17201b;
    }

    .profile-stat span {
      display: block;

      margin-top: 2px;

      color: #7b847f;

      font-size: 11px;
    }

    /* ========================================
       CHAT BUTTON
    ======================================== */

    .profile-actions {
      padding: 17px 18px 4px;
    }

    .profile-chat-btn,
    .profile-edit-btn {
      width: 100%;

      height: 46px;

      border: 0;
      border-radius: 24px;

      background: var(--primary);

      color: #fff;

      font-size: 14px;
      font-weight: 900;

      cursor: pointer;

      transition: .15s;
    }

    .profile-chat-btn:active,
    .profile-edit-btn:active {
      transform: scale(.98);
    }

    .profile-edit-btn {
      background: #eefbf1;
      color: var(--primary-dark);
    }

    /* ========================================
       STORIES AREA
    ======================================== */

    .profile-section {
      margin-top: 12px;

      background: #fff;

      border: 1px solid #e1e9e3;
      border-radius: 22px;

      padding: 16px;

      box-shadow:
        0 4px 14px rgba(31,41,55,.05);
    }

    .profile-section-title {
      font-size: 17px;

      color: var(--primary-dark);

      font-weight: 900;
    }

    .profile-empty {
      text-align: center;

      padding: 28px 10px;

      color: #8a928d;

      font-size: 13px;
    }

    /* ========================================
       LOADING
    ======================================== */

    .profile-loading {
      min-height: 350px;

      display: grid;
      place-items: center;

      color: #7b847f;

      font-size: 14px;
    }

    /* ========================================
       ERROR
    ======================================== */

    .profile-error {
      background: #fff;

      border: 1px solid #f1d5d5;

      color: #b42318;

      border-radius: 18px;

      padding: 20px;

      text-align: center;

      font-size: 13px;
    }

    /* ========================================
       MOBILE
    ======================================== */

    @media (max-width: 600px) {

      .profile-container {
        margin-top: 9px;
        padding: 0 8px;
      }

      .profile-cover {
        height: 110px;
      }

      .profile-avatar-wrap {
        width: 96px;
        height: 96px;
        margin-top: -48px;
      }

      .profile-avatar {
        width: 96px;
        height: 96px;

        font-size: 28px;
      }

      .profile-name {
        font-size: 20px;
      }

      .profile-card {
        border-radius: 20px;
      }

    }

  </style>

</head>


<body>

  <main class="profile-page">

    <!-- ========================================
         HEADER
    ======================================== -->

    <header class="profile-header">

      <button
        id="backBtn"
        class="profile-back"
        type="button"
        aria-label="Go back"
      >
        ←
      </button>

      <div class="profile-header-title">
        Profile
      </div>

    </header>


    <!-- ========================================
         PROFILE CONTENT
    ======================================== -->

    <section
      id="profileContainer"
      class="profile-container"
    >

      <div class="profile-loading">
        Loading profile...
      </div>

    </section>

  </main>


  <script
    type="module"
    src="js/profile.js"
  ></script>

</body>

  </html>
