<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#22C55E"
  >

  <title>Profile — CONNECTA</title>

  <link rel="stylesheet" href="css/main.css">

  <style>

    /* =====================================================
       CONNECTA PROFILE
       INSTANT / CACHE-FIRST / REALTIME
    ===================================================== */

    .profile-page {
      min-height: 100vh;
      background: #f7faf7;
      padding-bottom: 35px;
    }


    .profile-container {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      padding: 0 12px;
    }


    /* =====================================================
       HEADER
    ===================================================== */

    .profile-header {
      height: 64px;

      background: var(--primary);
      color: #fff;

      display: flex;
      align-items: center;

      padding: 0 14px;
      gap: 10px;

      position: sticky;
      top: 0;
      z-index: 50;

      box-shadow:
        0 4px 15px rgba(21,128,61,.18);
    }


    .profile-back {
      width: 42px;
      height: 42px;

      border: 0;
      background: transparent;

      color: #fff;

      display: grid;
      place-items: center;

      font-size: 27px;

      border-radius: 12px;

      cursor: pointer;
    }


    .profile-back:active {
      background: rgba(255,255,255,.15);
    }


    .profile-header-title {
      font-size: 19px;
      font-weight: 900;
    }


    /* =====================================================
       INSTANT PROFILE BOOTSTRAP
       
       This is displayed before profile.js finishes
       initializing.
       
       IMPORTANT:
       There is intentionally NO "Loading profile..."
       message here.
    ===================================================== */

    .profile-instant-shell {
      padding: 25px 10px 10px;

      text-align: center;

      animation:
        connectaInstantAppear
        .15s
        ease-out;
    }


    .profile-instant-avatar {
      width: 145px;
      height: 145px;

      padding: 5px;

      margin: 0 auto;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #22C55E,
          #16A34A
        );

      box-shadow:
        0 5px 18px rgba(21,128,61,.18);

      display: grid;
      place-items: center;
    }


    .profile-instant-avatar-inner {
      width: 135px;
      height: 135px;

      border-radius: 50%;

      overflow: hidden;

      background: #baf0ca;

      color: #08752f;

      display: grid;
      place-items: center;

      font-size: 42px;
      font-weight: 900;
    }


    .profile-instant-avatar-inner img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;
    }


    .profile-instant-name {
      margin-top: 16px;

      min-height: 30px;

      color: #17201b;

      font-size: 25px;
      font-weight: 900;

      overflow-wrap: anywhere;
    }


    .profile-instant-username {
      margin-top: 5px;

      color: #66706a;

      font-size: 13px;
    }


    .profile-instant-status {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 6px;

      margin-top: 8px;

      color: #16A34A;

      font-size: 12px;
      font-weight: 700;
    }


    .profile-instant-status-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #22C55E;

      box-shadow:
        0 0 0 3px rgba(34,197,94,.12);
    }


    @keyframes connectaInstantAppear {

      from {
        opacity: .4;
        transform: translateY(3px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }


    /* =====================================================
       PROFILE HERO
    ===================================================== */

    .profile-hero {
      text-align: center;
      padding: 25px 10px 10px;
    }


    /* =====================================================
       PROFILE PHOTO
    ===================================================== */

    .profile-photo-area {
      position: relative;

      width: 150px;
      height: 150px;

      margin: 0 auto;
    }


    .profile-photo-ring {
      width: 145px;
      height: 145px;

      padding: 5px;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #22C55E,
          #16A34A
        );

      box-shadow:
        0 5px 18px rgba(21,128,61,.18);

      display: grid;
      place-items: center;
    }


    .profile-avatar {
      width: 135px;
      height: 135px;

      border-radius: 50%;

      overflow: hidden;

      background: #baf0ca;
      color: #08752f;

      display: grid;
      place-items: center;

      font-size: 42px;
      font-weight: 900;
    }


    .profile-avatar img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;

      opacity: 0;

      transition:
        opacity .18s ease;
    }


    .profile-avatar img.connecta-profile-image-ready {
      opacity: 1;
    }


    /* =====================================================
       PHOTO UPLOAD
       ONLY OWN PROFILE
    ===================================================== */

    .profile-photo-upload {
      position: absolute;

      right: -2px;
      bottom: 4px;

      width: 48px;
      height: 48px;

      border-radius: 50%;

      border: 4px solid #fff;

      background: #fff;
      color: #15803D;

      display: grid;
      place-items: center;

      font-size: 20px;

      cursor: pointer;

      box-shadow:
        0 3px 12px rgba(0,0,0,.15);
    }


    .profile-photo-upload:active {
      transform: scale(.94);
    }


    #profilePhotoInput {
      display: none;
    }


    .profile-upload-text {
      margin-top: 4px;

      color: #737b76;

      font-size: 13px;
    }


    .profile-upload-status {
      min-height: 18px;

      margin-top: 4px;

      font-size: 11px;

      color: #737b76;
    }


    .profile-upload-status.success {
      color: #15803D;
    }


    .profile-upload-status.error {
      color: #DC2626;
    }


    /* =====================================================
       NAME
    ===================================================== */

    .profile-name-row {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 6px;

      margin-top: 15px;
    }


    .profile-name {
      font-size: 28px;

      line-height: 1.2;

      font-weight: 900;

      color: #17201b;

      overflow-wrap: anywhere;
    }


    /* =====================================================
       VERIFIED BADGE
    ===================================================== */

    .verified-badge {
      width: 21px;
      height: 21px;

      min-width: 21px;

      border-radius: 50%;

      background: #1d9bf0;

      color: #fff;

      display: inline-flex;

      align-items: center;
      justify-content: center;

      font-size: 12px;
      font-weight: 900;

      line-height: 1;

      box-shadow:
        0 1px 3px rgba(0,0,0,.15);
    }


    .profile-username {
      margin-top: 5px;

      color: #66706a;

      font-size: 13px;
    }


    /* =====================================================
       STATUS
    ===================================================== */

    .profile-status {
      display: flex;

      justify-content: center;
      align-items: center;

      gap: 6px;

      margin-top: 8px;

      font-size: 12px;
      font-weight: 700;
    }


    .profile-status.online {
      color: #16A34A;
    }


    .profile-status.offline {
      color: #9CA3AF;
    }


    .profile-status-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      display: inline-block;
    }


    .profile-status-dot.online {
      background: #22C55E;

      box-shadow:
        0 0 0 3px rgba(34,197,94,.12);
    }


    .profile-status-dot.offline {
      background: #9CA3AF;
    }


    /* =====================================================
       BIO
    ===================================================== */

    .profile-bio {
      max-width: 420px;

      margin: 10px auto 0;

      color: #66706a;

      font-size: 13px;

      line-height: 1.5;
    }


    /* =====================================================
       ACTION BUTTONS
    ===================================================== */

    .profile-main-action {
      padding: 8px 0 18px;

      text-align: center;

      display: flex;

      flex-wrap: wrap;

      justify-content: center;

      gap: 9px;
    }


    .profile-verify-btn,
    .profile-chat-btn,
    .profile-edit-btn,
    .profile-follow-btn {
      width: 240px;

      min-height: 48px;

      border: 0;

      border-radius: 28px;

      font-size: 14px;

      font-weight: 900;

      cursor: pointer;

      transition: .15s;
    }


    .profile-verify-btn {
      background: var(--primary);
      color: #fff;

      box-shadow:
        0 5px 15px rgba(21,128,61,.15);
    }


    .profile-chat-btn {
      background: var(--primary);
      color: #fff;
    }


    .profile-follow-btn {
      background: #fff;
      color: var(--primary);

      border: 1px solid #bde5c8;
    }


    .profile-follow-btn.following {
      background: #eaf9ee;
      color: var(--primary-dark);

      border-color: #d4eedb;
    }


    .profile-edit-btn {
      background: #eaf9ee;

      color: var(--primary-dark);

      border: 1px solid #d4eedb;
    }


    .profile-verify-btn:active,
    .profile-chat-btn:active,
    .profile-edit-btn:active,
    .profile-follow-btn:active {
      transform: scale(.97);
    }


    .profile-verify-btn:disabled,
    .profile-chat-btn:disabled,
    .profile-follow-btn:disabled {
      opacity: .6;

      cursor: not-allowed;
    }


    .profile-verified-text {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 6px;

      padding: 10px 18px;

      border-radius: 25px;

      background: #eef7ff;

      color: #1769aa;

      font-size: 13px;
      font-weight: 800;
    }


    /* =====================================================
       PUBLIC PROFILE STATS
    ===================================================== */

    .profile-public-stats {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      margin-top: 14px;

      border-top: 1px solid #e5ebe7;
    }


    .profile-public-stat {
      text-align: center;

      padding: 14px 8px 4px;
    }


    .profile-public-stat + .profile-public-stat {
      border-left: 1px solid #e5ebe7;
    }


    .profile-public-stat-value {
      color: #17201b;

      font-size: 18px;
      font-weight: 900;
    }


    .profile-public-stat-label {
      margin-top: 3px;

      color: #727b75;

      font-size: 12px;
    }


    /* =====================================================
       INFORMATION CARDS
    ===================================================== */

    .profile-card {
      background: #fff;

      border: 1px solid #e1e9e3;

      border-radius: 21px;

      padding: 18px;

      margin-top: 13px;

      box-shadow:
        0 5px 18px rgba(31,41,55,.05);
    }


    .profile-card-title {
      color: var(--primary-dark);

      font-size: 19px;
      font-weight: 900;

      padding-bottom: 12px;

      border-bottom:
        1px solid #e5ebe7;
    }


    /* =====================================================
       ACCOUNT STATISTICS
    ===================================================== */

    .profile-stat-grid {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      margin-top: 14px;
    }


    .profile-stat-box {
      padding: 4px 10px;
    }


    .profile-stat-box + .profile-stat-box {
      border-left: 1px solid #e5ebe7;
    }


    .profile-stat-label {
      color: #727b75;

      font-size: 12px;
    }


    .profile-stat-value {
      margin-top: 5px;

      color: #17201b;

      font-size: 17px;

      font-weight: 900;
    }


    .profile-stat-value.active {
      color: #16A34A;
    }


    /* =====================================================
       INFORMATION ROWS
    ===================================================== */

    .profile-info-row {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;

      padding: 8px 0;

      font-size: 14px;
    }


    .profile-info-label {
      color: #68726c;
    }


    .profile-info-value {
      color: #17201b;

      font-weight: 700;

      text-align: right;

      overflow-wrap: anywhere;
    }


    /* =====================================================
       REFER & EARN
    ===================================================== */

    .profile-earn-btn {
      width: 100%;

      height: 48px;

      margin-top: 14px;

      border: 0;

      border-radius: 25px;

      background: #eaf9ee;

      color: var(--primary-dark);

      font-size: 14px;

      font-weight: 900;

      cursor: pointer;
    }


    .profile-earn-btn:active {
      transform: scale(.98);
    }


    /* =====================================================
       STORIES
    ===================================================== */

    .profile-stories-card {
      margin-top: 13px;
    }


    .profile-empty {
      text-align: center;

      padding: 27px 10px 12px;

      color: #8a928d;

      font-size: 13px;
    }


    /* =====================================================
       ERROR
    ===================================================== */

    .profile-error {
      background: #fff;

      border: 1px solid #f1d5d5;

      color: #b42318;

      border-radius: 18px;

      padding: 20px;

      margin-top: 20px;

      text-align: center;

      font-size: 13px;
    }


    /* =====================================================
       VERIFICATION MODAL
    ===================================================== */

    .verification-modal {
      position: fixed;

      inset: 0;

      z-index: 100;

      display: none;

      align-items: flex-end;

      justify-content: center;

      background: rgba(0,0,0,.48);
    }


    .verification-modal.show {
      display: flex;
    }


    .verification-box {
      width: 100%;

      max-width: 520px;

      background: #fff;

      border-radius: 25px 25px 0 0;

      padding: 22px 18px 28px;

      box-shadow:
        0 -10px 35px rgba(0,0,0,.18);
    }


    .verification-close-row {
      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom: 12px;
    }


    .verification-title {
      font-size: 19px;

      font-weight: 900;

      color: #17201b;
    }


    .verification-close {
      width: 38px;
      height: 38px;

      border: 0;

      border-radius: 50%;

      background: #f1f5f2;

      color: #47534c;

      font-size: 22px;

      cursor: pointer;
    }


    .verification-icon {
      width: 58px;
      height: 58px;

      margin: 4px auto 12px;

      border-radius: 50%;

      background: #eaf9ee;

      color: var(--primary);

      display: grid;
      place-items: center;

      font-size: 27px;
      font-weight: 900;
    }


    .verification-description {
      color: #66706a;

      font-size: 13px;

      line-height: 1.55;

      text-align: center;

      margin-bottom: 16px;
    }


    .verification-price {
      text-align: center;

      font-size: 26px;

      font-weight: 900;

      color: #17201b;

      margin-bottom: 17px;
    }


    .verification-price span {
      display: block;

      margin-top: 2px;

      color: #7b847f;

      font-size: 11px;

      font-weight: 600;
    }


    .verification-label {
      display: block;

      margin-bottom: 6px;

      color: #344139;

      font-size: 12px;

      font-weight: 800;
    }


    .verification-input {
      width: 100%;

      height: 48px;

      border: 1px solid #dce5df;

      border-radius: 13px;

      padding: 0 14px;

      outline: none;

      font-size: 14px;

      background: #fafcfb;
    }


    .verification-input:focus {
      border-color: #22c55e;

      box-shadow:
        0 0 0 3px rgba(34,197,94,.10);
    }


    .verification-submit {
      width: 100%;

      height: 48px;

      margin-top: 14px;

      border: 0;

      border-radius: 25px;

      background: var(--primary);

      color: #fff;

      font-size: 14px;

      font-weight: 900;

      cursor: pointer;
    }


    .verification-submit:disabled {
      opacity: .6;

      cursor: not-allowed;
    }


    .verification-message {
      min-height: 20px;

      margin-top: 10px;

      text-align: center;

      font-size: 12px;

      line-height: 1.45;
    }


    .verification-message.error {
      color: #dc2626;
    }


    .verification-message.success {
      color: #15803d;
    }


    .verification-message.pending {
      color: #1769aa;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 600px) {

      .profile-container {
        padding: 0 9px;
      }


      .profile-hero {
        padding-top: 23px;
      }


      .profile-instant-shell {
        padding-top: 23px;
      }


      .profile-photo-area {
        width: 145px;
        height: 145px;
      }


      .profile-photo-ring {
        width: 140px;
        height: 140px;
      }


      .profile-avatar {
        width: 130px;
        height: 130px;

        font-size: 38px;
      }


      .profile-photo-upload {
        width: 46px;
        height: 46px;

        right: -1px;
      }


      .profile-instant-avatar {
        width: 140px;
        height: 140px;
      }


      .profile-instant-avatar-inner {
        width: 130px;
        height: 130px;

        font-size: 38px;
      }


      .profile-name {
        font-size: 25px;
      }


      .profile-instant-name {
        font-size: 25px;
      }


      .profile-card {
        border-radius: 19px;

        padding: 17px;
      }


      .profile-main-action {
        padding-left: 8px;
        padding-right: 8px;
      }


      .profile-verify-btn,
      .profile-chat-btn,
      .profile-edit-btn,
      .profile-follow-btn {
        width: 100%;
        max-width: 280px;
      }

    }

  </style>

</head>


<body>

  <main class="profile-page">


    <!-- =================================================
         HEADER
    ================================================= -->

    <header class="profile-header">

      <button
        id="backBtn"
        class="profile-back"
        type="button"
        aria-label="Go back"
      >
        ←
      </button>


      <div
        id="profileHeaderTitle"
        class="profile-header-title"
      >
        Profile
      </div>

    </header>


    <!-- =================================================
         PROFILE CONTENT

         IMPORTANT:
         There is NO "Loading profile..." text.

         profile.js will immediately replace this
         with the cached/full profile.
    ================================================= -->

    <section
      id="profileContainer"
      class="profile-container"
    >

      <div
        id="instantProfileShell"
        class="profile-instant-shell"
      >

        <div
          id="instantProfileAvatar"
          class="profile-instant-avatar"
        >

          <div
            id="instantProfileAvatarInner"
            class="profile-instant-avatar-inner"
          >
            U
          </div>

        </div>


        <div
          id="instantProfileName"
          class="profile-instant-name"
        >
        </div>


        <div
          id="instantProfileUsername"
          class="profile-instant-username"
        >
        </div>


        <div
          id="instantProfileStatus"
          class="profile-instant-status"
        >

          <span
            class="profile-instant-status-dot"
          ></span>

          Online

        </div>

      </div>

    </section>

  </main>


  <!-- =====================================================
       VERIFY ACCOUNT MODAL
  ===================================================== -->

  <div
    id="verificationModal"
    class="verification-modal"
    aria-hidden="true"
  >

    <div
      class="verification-box"
      role="dialog"
      aria-modal="true"
      aria-labelledby="verificationTitle"
    >

      <div class="verification-close-row">

        <div
          id="verificationTitle"
          class="verification-title"
        >
          Verify Account
        </div>


        <button
          id="verificationClose"
          class="verification-close"
          type="button"
          aria-label="Close"
        >
          ×
        </button>

      </div>


      <div class="verification-icon">
        ✓
      </div>


      <p class="verification-description">

        Get the blue verified badge on your CONNECTA
        profile. Verification requires a one-time payment
        of KSh 999. Your payment will be processed
        securely through CONNECTA.

      </p>


      <div class="verification-price">

        KSh 999

        <span>
          One-time account verification
        </span>

      </div>


      <label
        class="verification-label"
        for="verificationPhone"
      >
        M-PESA phone number
      </label>


      <input
        id="verificationPhone"
        class="verification-input"
        type="tel"
        inputmode="tel"
        autocomplete="tel"
        placeholder="07XXXXXXXX"
        maxlength="15"
      >


      <button
        id="verificationSubmit"
        class="verification-submit"
        type="button"
      >
        Pay KSh 999 &amp; Verify
      </button>


      <div
        id="verificationMessage"
        class="verification-message"
        aria-live="polite"
      ></div>

    </div>

  </div>


  <!-- =====================================================
       PROFILE ENGINE
  ===================================================== -->

  <script
    type="module"
    src="js/profile.js"
  ></script>


  <!-- =====================================================
       INSTANT CACHE BOOTSTRAP

       This runs BEFORE profile.js because it is a normal
       script.

       It checks localStorage for the profile cache and
       immediately puts the user's name/photo on screen.

       Firebase then takes over through profile.js.
  ===================================================== -->

  <script>

  /*
   * =====================================================
   * CONNECTA — INSTANT PROFILE BOOTSTRAP
   * =====================================================
   *
   * Runs immediately from localStorage.
   *
   * It NEVER replaces the real Firebase profile.
   * profile.js takes over after Firebase Auth starts.
   */

  (function () {

    try {

      const params =
        new URLSearchParams(
          window.location.search
        );


      /*
       * Support all profile URL formats:
       *
       * profile.html?uid=XXXX
       * profile.html?userId=XXXX
       * profile.html?id=XXXX
       */

      const requestedUid =
        (
          params.get("uid") ||
          params.get("userId") ||
          params.get("id") ||
          ""
        ).trim();


      let profile = null;


      /*
       * =================================================
       * OTHER USER PROFILE
       * =================================================
       */

      if (requestedUid) {

        const publicCacheKeys = [

          `connectaPublicProfileCache_v2_${requestedUid}`,

          `connectaPublicProfileCache_v3_${requestedUid}`

        ];


        for (
          const cacheKey
          of publicCacheKeys
        ) {

          const raw =
            localStorage.getItem(
              cacheKey
            );


          if (!raw) {
            continue;
          }


          try {

            const cached =
              JSON.parse(raw);


            if (
              cached &&
              cached.uid === requestedUid
            ) {

              profile =
                cached;

              break;
            }

          } catch (error) {

            console.warn(
              "Invalid public profile cache:",
              cacheKey
            );

          }

        }

      }


      /*
       * =================================================
       * OWN PROFILE
       * =================================================
       *
       * Only use own cache when there is NO requested UID.
       */

      if (!requestedUid) {

        const ownCacheKeys = [

          "connectaOwnProfileCache_v2",

          "connectaOwnProfileCache_v3",

          "connectaProfileCache",

          "connectaProfileCache_v2",

          "connectaCurrentUserProfile_v1"

        ];


        for (
          const cacheKey
          of ownCacheKeys
        ) {

          const raw =
            localStorage.getItem(
              cacheKey
            );


          if (!raw) {
            continue;
          }


          try {

            const cached =
              JSON.parse(raw);


            if (
              cached &&
              cached.uid
            ) {

              profile =
                cached;

              break;
            }

          } catch (error) {

            console.warn(
              "Invalid own profile cache:",
              cacheKey
            );

          }

        }

      }


      /*
       * =================================================
       * NOTHING CACHED
       * =================================================
       *
       * Leave the clean instant shell visible.
       *
       * DO NOT show an error.
       */

      if (!profile) {
        return;
      }


      /*
       * =================================================
       * PROFILE NAME
       * =================================================
       */

      const name =
        profile.displayName ||

        (
          `${profile.firstName || ""} ` +
          `${profile.lastName || ""}`
        ).trim() ||

        profile.username ||

        "CONNECTA User";


      /*
       * =================================================
       * USERNAME
       * =================================================
       */

      const username =
        profile.username

          ? "@" +
            String(
              profile.username
            ).replace(
              /^@/,
              ""
            )

          : "";


      /*
       * =================================================
       * PHOTO
       * =================================================
       */

      const photo =
        profile.photoURL ||
        profile.photoUrl ||
        "";


      /*
       * =================================================
       * DOM
       * =================================================
       */

      const avatar =
        document.getElementById(
          "instantProfileAvatarInner"
        );


      const nameElement =
        document.getElementById(
          "instantProfileName"
        );


      const usernameElement =
        document.getElementById(
          "instantProfileUsername"
        );


      const statusElement =
        document.getElementById(
          "instantProfileStatus"
        );


      /*
       * =================================================
       * AVATAR
       * =================================================
       */

      if (avatar) {

        if (photo) {

          const image =
            document.createElement(
              "img"
            );


          image.src =
            photo;


          image.alt =
            "";


          image.decoding =
            "async";


          avatar.replaceChildren(
            image
          );

        } else {

          const parts =
            String(name)
              .trim()
              .split(/\s+/)
              .filter(Boolean);


          const initials =
            parts.length === 1

              ? parts[0]
                  .slice(0, 2)
                  .toUpperCase()

              : (
                  (parts[0]?.[0] || "") +
                  (
                    parts[
                      parts.length - 1
                    ]?.[0] || ""
                  )
                ).toUpperCase();


          avatar.textContent =
            initials ||
            "U";

        }

      }


      /*
       * =================================================
       * NAME
       * =================================================
       */

      if (nameElement) {

        nameElement.textContent =
          name;

      }


      /*
       * =================================================
       * USERNAME
       * =================================================
       */

      if (usernameElement) {

        usernameElement.textContent =
          username;

      }


      /*
       * =================================================
       * STATUS
       * =================================================
       */

      if (statusElement) {

        const online =
          requestedUid
            ? profile.isOnline === true
            : true;


        statusElement.innerHTML =
          online

            ? `
                <span
                  class="profile-instant-status-dot"
                ></span>
                Online
              `

            : `
                <span
                  class="profile-instant-status-dot"
                  style="
                    background:#9CA3AF;
                    box-shadow:none;
                  "
                ></span>
                Offline
              `;

      }


    } catch (error) {

      /*
       * Cache errors must NEVER prevent
       * profile.js from running.
       */

      console.warn(
        "CONNECTA instant profile bootstrap:",
        error
      );

    }

  })();

  </script>

</body>

  </html>
