<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#22c55e"
    >

    <title>Chat • CONNECTA</title>


    <style>

        /* =====================================================
           CONNECTA CHAT
        ===================================================== */

        :root {

            --connecta-green: #22c55e;
            --connecta-green-dark: #16a34a;
            --connecta-green-light: #dcfce7;

            --page-bg: #f4f8f5;

            --white: #ffffff;

            --text: #18221c;
            --muted: #7b857e;

            --border: #e3e9e5;

            --incoming-bg: #ffffff;
            --outgoing-bg: #22c55e;

            --blue-read: #2196f3;

            --header-height: 72px;
            --composer-height: 76px;
        }


        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background:
                var(--page-bg);

            color:
                var(--text);

            overflow: hidden;

            -webkit-font-smoothing: antialiased;

            -webkit-tap-highlight-color:
                transparent;
        }


        button,
        textarea {
            font: inherit;
        }


        button {
            border: 0;
            cursor: pointer;
        }


        /* =====================================================
           APP
        ===================================================== */

        .chat-app {

            width: 100%;
            height: 100dvh;

            display: flex;

            flex-direction: column;

            overflow: hidden;

            background:
                var(--page-bg);
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .chat-header {

            width: 100%;

            height:
                var(--header-height);

            min-height:
                var(--header-height);

            display: flex;

            align-items: center;

            padding:
                0 8px;

            background:
                linear-gradient(
                    135deg,
                    #22c55e,
                    #1bc45c
                );

            color:
                #ffffff;

            box-shadow:
                0 2px 8px
                rgba(0,0,0,.12);

            position:
                relative;

            z-index: 20;
        }


        /* =====================================================
           HEADER BUTTONS
        ===================================================== */

        .header-button,
        #profileBtn {

            width: 44px;
            height: 44px;

            min-width: 44px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                transparent;

            color:
                #ffffff;

            transition:
                background .15s ease,
                transform .15s ease;
        }


        .header-button:active,
        #profileBtn:active {

            background:
                rgba(255,255,255,.16);

            transform:
                scale(.93);
        }


        .back-icon {

            width: 27px;
            height: 27px;
        }


        /* =====================================================
           CHAT USER
        ===================================================== */

        .chat-user {

            min-width: 0;

            flex: 1;

            height: 100%;

            display: flex;

            align-items: center;

            margin-left: 1px;

            cursor: pointer;
        }


        /* =====================================================
           AVATAR
        ===================================================== */

        .chat-avatar-wrap {

            width: 48px;
            height: 48px;

            min-width: 48px;

            position: relative;

            margin-right: 10px;
        }


        .chat-avatar {

            width: 48px;
            height: 48px;

            border-radius: 50%;

            background:
                #ffffff;

            color:
                var(--connecta-green-dark);

            border:
                2px solid
                rgba(255,255,255,.8);

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 16px;

            font-weight: 800;

            overflow: hidden;
        }


        .chat-avatar img {

            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
        }


        /* =====================================================
           ONLINE DOT
        ===================================================== */

        .chat-online-dot {

            position: absolute;

            right: -1px;
            bottom: 0;

            width: 16px;
            height: 16px;

            border-radius: 50%;

            background:
                #ffffff;

            display: none;

            align-items: center;
            justify-content: center;

            box-shadow:
                0 1px 3px
                rgba(0,0,0,.2);
        }


        .chat-online-dot::after {

            content: "";

            width: 10px;
            height: 10px;

            border-radius: 50%;

            background:
                #18c866;
        }


        /* =====================================================
           USER INFORMATION
        ===================================================== */

        .chat-user-info {

            min-width: 0;

            display: flex;

            flex-direction: column;

            justify-content: center;
        }


        .chat-user-name-row {

            min-width: 0;

            display: flex;

            align-items: center;

            gap: 5px;
        }


        #chatUserName {

            max-width: 230px;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

            font-size: 17px;

            font-weight: 700;

            line-height: 21px;
        }


        /* =====================================================
           VERIFIED BADGE
        ===================================================== */

        .verified-badge {

            width: 17px;
            height: 17px;

            min-width: 17px;

            border-radius: 50%;

            background:
                #1d9bf0;

            color:
                #ffffff;

            display: inline-flex;

            align-items: center;
            justify-content: center;

            font-size: 10px;

            font-weight: 900;

            line-height: 1;
        }


        /* =====================================================
           STATUS
        ===================================================== */

        .chat-status {

            height: 18px;

            min-width: 0;

            display: flex;

            align-items: center;

            color:
                rgba(255,255,255,.92);

            font-size: 12px;

            line-height: 16px;
        }


        #chatStatusText {

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }


        /* =====================================================
           TYPING INDICATOR
        ===================================================== */

        .typing-status {

            display: inline-flex;

            align-items: center;

            gap: 3px;

            color:
                #ffffff;
        }


        .typing-label {

            font-weight: 600;

            margin-right: 2px;
        }


        .typing-dot {

            width: 4px;
            height: 4px;

            border-radius: 50%;

            background:
                #ffffff;

            animation:
                typingBounce 1.2s
                infinite ease-in-out;
        }


        .typing-dot:nth-child(2) {

            animation-delay:
                .15s;
        }


        .typing-dot:nth-child(3) {

            animation-delay:
                .3s;
        }


        @keyframes typingBounce {

            0%,
            60%,
            100% {

                transform:
                    translateY(0);

                opacity:
                    .55;
            }

            30% {

                transform:
                    translateY(-3px);

                opacity:
                    1;
            }
        }


        /* =====================================================
           MENU DOTS
        ===================================================== */

        .dots {

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 3px;
        }


        .dots span {

            width: 4px;
            height: 4px;

            border-radius: 50%;

            background:
                #ffffff;
        }


        /* =====================================================
           MESSAGES CONTAINER
        ===================================================== */

        .messages-container {

            flex: 1;

            min-height: 0;

            overflow-y: auto;

            overflow-x: hidden;

            padding:
                10px
                7px
                14px;

            background:

                radial-gradient(
                    circle at top,
                    rgba(34,197,94,.035),
                    transparent 40%
                ),

                var(--page-bg);

            -webkit-overflow-scrolling:
                touch;

            scroll-behavior:
                smooth;
        }


        .messages-container::-webkit-scrollbar {

            width: 3px;
        }


        .messages-container::-webkit-scrollbar-track {

            background:
                transparent;
        }


        .messages-container::-webkit-scrollbar-thumb {

            background:
                rgba(34,197,94,.22);

            border-radius:
                20px;
        }


        /* =====================================================
           DATE SEPARATOR
        ===================================================== */

        .date-separator {

            display: flex;

            align-items: center;

            justify-content: center;

            margin:
                7px 0 11px;
        }


        .date-separator span {

            padding:
                5px 11px;

            border-radius:
                16px;

            background:
                #e8efea;

            color:
                #707a73;

            font-size:
                11px;

            font-weight:
                600;

            line-height:
                14px;
        }


        /* =====================================================
           MESSAGE ROW

           IMPORTANT:
           Supports:

           .incoming
           .outgoing

           AND

           .theirs
           .mine
        ===================================================== */

        .message-row {

            width: 100% !important;

            display: flex !important;

            align-items: flex-start !important;

            height: auto !important;

            min-height: 0 !important;

            margin:
                0 0 3px 0 !important;

            padding:
                0 !important;

            flex:
                none !important;
        }


        .message-row.incoming,
        .message-row.theirs {

            justify-content:
                flex-start !important;
        }


        .message-row.outgoing,
        .message-row.mine {

            justify-content:
                flex-end !important;
        }


        /* =====================================================
           COMPACT MESSAGE BUBBLE

           THIS IS THE MAIN FIX

           The bubble only grows around its content.
        ===================================================== */

        .message-bubble {

    display: block !important;

    width: fit-content !important;

    max-width: 78% !important;

    min-width: 0 !important;

    min-height: 0 !important;

    height: auto !important;

    margin: 0 !important;

    padding: 4px 7px 4px 7px !important;

    border-radius: 12px !important;

    font-size: 14px !important;

    line-height: 18px !important;

    word-break: normal !important;

    overflow-wrap: anywhere !important;

    box-sizing: border-box !important;

    flex: 0 0 auto !important;

    box-shadow:
        0 1px 3px rgba(0,0,0,.06);
    }


        /* =====================================================
           INCOMING MESSAGE
        ===================================================== */

        .incoming .message-bubble,
        .theirs .message-bubble {

            background:
                var(--incoming-bg);

            color:
                #202821;

            border:
                1px solid #e7ece8;

            border-top-left-radius:
                4px;
        }


        /* =====================================================
           OUTGOING MESSAGE
        ===================================================== */

        .outgoing .message-bubble,
        .mine .message-bubble {

            background:
                linear-gradient(
                    135deg,
                    #22c55e,
                    #19bd5b
                );

            color:
                #ffffff;

            border-top-right-radius:
                4px;

            box-shadow:
                0 1px 4px
                rgba(34,197,94,.17);
        }


        /* =====================================================
           MESSAGE TEXT

           IMPORTANT:
           No width:100%
        ===================================================== */

        .message-text {

    display: inline !important;

    width: auto !important;

    max-width: none !important;

    height: auto !important;

    min-height: 0 !important;

    margin: 0 !important;

    padding: 0 !important;

    white-space: pre-wrap !important;

    line-height: 18px !important;

    font-size: 14px !important;

    word-break: normal !important;

    overflow-wrap: anywhere !important;
    }


        /* =====================================================
           MESSAGE META

           IMPORTANT:
           NO width:100%
        ===================================================== */

        .message-meta {

    display: inline-flex !important;

    align-items: center !important;

    justify-content: flex-end !important;

    width: auto !important;

    max-width: none !important;

    height: 10px !important;

    min-height: 10px !important;

    margin: 0 0 0 5px !important;

    padding: 0 !important;

    gap: 2px !important;

    font-size: 8px !important;

    line-height: 10px !important;

    white-space: nowrap !important;

    vertical-align: bottom !important;

    user-select: none;
  }


        /* =====================================================
           INCOMING META
        ===================================================== */

        .incoming .message-meta,
        .theirs .message-meta {

            color:
                #a0a8a3;
        }


        /* =====================================================
           OUTGOING META
        ===================================================== */

        .outgoing .message-meta,
        .mine .message-meta {

            color:
                rgba(255,255,255,.82);
        }


        /* =====================================================
           MESSAGE CHECKS
        ===================================================== */

        .message-checks {

            display:
                inline-flex !important;

            align-items:
                center;

            width:
                auto !important;

            height:
                auto !important;

            min-height:
                0 !important;

            margin:
                0 !important;

            padding:
                0 !important;

            font-size:
                11px !important;

            line-height:
                10px !important;

            font-weight:
                700;

            letter-spacing:
                -2px;

            white-space:
                nowrap;
        }


        /* =====================================================
           READ = BLUE DOUBLE CHECK
        ===================================================== */

        .message-checks.read {

            color:
                var(--blue-read) !important;
        }

        /* =====================================================
   PHOTO MESSAGE
===================================================== */

.message-image {

    display: block;

    width: auto;

    max-width: 260px;

    max-height: 320px;

    border-radius: 10px;

    object-fit: cover;

    cursor: pointer;

    margin: 0;

}


.incoming .message-image,
.theirs .message-image {

    border:
        1px solid #e7ece8;
}


.outgoing .message-image,
.mine .message-image {

    border:
        1px solid rgba(255,255,255,.35);
}


.image-message-content {

    display: block;

    line-height: 0;
}


/* =====================================================
   PHOTO UPLOAD STATUS
===================================================== */

.photo-upload-status {

    display: none;

    position: absolute;

    left: 8px;

    right: 8px;

    bottom: 84px;

    padding: 9px 12px;

    border-radius: 12px;

    background: rgba(24,34,28,.92);

    color: #ffffff;

    font-size: 12px;

    text-align: center;

    z-index: 50;
}


.photo-upload-status.show {

    display: block;
}


/* =====================================================
   PHOTO PREVIEW
===================================================== */

.photo-preview {

    display: none;

    position: absolute;

    left: 8px;

    right: 8px;

    bottom: 84px;

    padding: 8px;

    border-radius: 14px;

    background: #ffffff;

    border: 1px solid var(--border);

    box-shadow:
        0 4px 18px rgba(0,0,0,.12);

    z-index: 45;
}


.photo-preview.show {

    display: flex;

    align-items: center;

    gap: 10px;
}


.photo-preview img {

    width: 54px;

    height: 54px;

    border-radius: 9px;

    object-fit: cover;
}


.photo-preview-info {

    min-width: 0;

    flex: 1;
}


.photo-preview-title {

    font-size: 13px;

    font-weight: 700;

    color: var(--text);
}


.photo-preview-size {

    margin-top: 2px;

    font-size: 11px;

    color: var(--muted);
}


.photo-preview-cancel {

    width: 34px;

    height: 34px;

    border-radius: 50%;

    background: #f1f4f2;

    color: #68736c;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 18px;
}


/* =====================================================
   PHOTO MESSAGE MOBILE SIZE
===================================================== */

@media (max-width: 380px) {

    .message-image {

        max-width: 220px;

        max-height: 280px;
    }

}


        /* =====================================================
           EMPTY CHAT
        ===================================================== */

        .empty-chat {

            min-height:
                100%;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            text-align:
                center;

            padding:
                30px 20px;
        }


        .empty-chat-card {

            max-width:
                280px;

            padding:
                20px 18px;

            border-radius:
                18px;

            background:
                rgba(255,255,255,.9);

            border:
                1px solid var(--border);

            box-shadow:
                0 2px 12px
                rgba(0,0,0,.05);
        }


        .empty-chat-icon {

            width:
                50px;

            height:
                50px;

            margin:
                0 auto 10px;

            border-radius:
                50%;

            background:
                var(--connecta-green-light);

            color:
                var(--connecta-green-dark);

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            font-size:
                22px;
        }


        .empty-chat-card h3 {

            font-size:
                15px;

            margin-bottom:
                5px;
        }


        .empty-chat-card p {

            color:
                var(--muted);

            font-size:
                12px;

            line-height:
                18px;
        }


        /* =====================================================
           COMPOSER
        ===================================================== */

        .message-composer {

            width:
                100%;

            min-height:
                var(--composer-height);

            padding:
                8px
                9px
                calc(
                    8px +
                    env(safe-area-inset-bottom)
                );

            display:
                flex;

            align-items:
                flex-end;

            gap:
                8px;

            background:
                rgba(255,255,255,.98);

            border-top:
                1px solid var(--border);

            box-shadow:
                0 -2px 10px
                rgba(0,0,0,.035);

            position:
                relative;

            z-index:
                20;
        }


        /* =====================================================
           ATTACH BUTTON
        ===================================================== */

        .attach-button {

            width:
                50px;

            height:
                50px;

            min-width:
                50px;

            border-radius:
                9px;

            background:
                #eef2ef;

            color:
                var(--connecta-green-dark);

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            transition:
                transform .15s ease;
        }


        .attach-button:active {

            transform:
                scale(.93);
        }


        .attach-icon {

            width:
                24px;

            height:
                24px;
        }


        /* =====================================================
           INPUT WRAPPER
        ===================================================== */

        .input-wrapper {

            flex:
                1;

            min-width:
                0;

            position:
                relative;

            display:
                flex;

            align-items:
                center;
        }


        /* =====================================================
           MESSAGE INPUT
        ===================================================== */

        .message-input {

            width:
                100%;

            min-height:
                50px;

            max-height:
                120px;

            resize:
                none;

            overflow-y:
                auto;

            padding:
                13px 15px;

            border:
                2px solid
                var(--connecta-green);

            border-radius:
                9px;

            background:
                #ffffff;

            color:
                var(--text);

            outline:
                none;

            font-size:
                14px;

            line-height:
                19px;

            transition:
                box-shadow .2s ease;
        }


        .message-input:focus {

            box-shadow:
                0 0 0 3px
                rgba(34,197,94,.1);
        }


        .message-input::placeholder {

            color:
                transparent;
        }


        .message-input::-webkit-scrollbar {

            width:
                3px;
        }


        .message-input::-webkit-scrollbar-thumb {

            background:
                #bac7be;

            border-radius:
                20px;
        }


        /* =====================================================
           INPUT LABEL
        ===================================================== */

        .input-label {

            position:
                absolute;

            left:
                12px;

            top:
                -8px;

            padding:
                0 6px;

            background:
                #ffffff;

            color:
                var(--connecta-green-dark);

            font-size:
                13px;

            font-weight:
                600;

            pointer-events:
                none;
        }


        /* =====================================================
           SEND BUTTON
        ===================================================== */

        .send-button {

            width:
                50px;

            height:
                50px;

            min-width:
                50px;

            border-radius:
                9px;

            background:
                linear-gradient(
                    135deg,
                    #22c55e,
                    #16b957
                );

            color:
                #ffffff;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            box-shadow:
                0 3px 8px
                rgba(34,197,94,.2);

            transition:
                transform .15s ease,
                opacity .2s ease;
        }


        .send-button:active {

            transform:
                scale(.92);
        }


        .send-button:disabled {

            opacity:
                .55;

            box-shadow:
                none;
        }


        .send-icon {

            width:
                26px;

            height:
                26px;
        }


        /* =====================================================
           LOADING
        ===================================================== */

        .chat-loading {

            min-height:
                100%;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            color:
                var(--muted);

            font-size:
                13px;
        }


        .loading-spinner {

            width:
                22px;

            height:
                22px;

            margin-right:
                8px;

            border:
                3px solid
                #dce6df;

            border-top-color:
                var(--connecta-green);

            border-radius:
                50%;

            animation:
                spin .8s linear infinite;
        }


        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }
        }


        /* =====================================================
           SMALL PHONES
        ===================================================== */

        @media (max-width: 380px) {

            .chat-avatar-wrap,
            .chat-avatar {

                width:
                    44px;

                height:
                    44px;
            }


            .chat-avatar-wrap {

                min-width:
                    44px;

                margin-right:
                    8px;
            }


            #chatUserName {

                max-width:
                    175px;

                font-size:
                    16px;
            }


            .messages-container {

                padding-left:
                    6px;

                padding-right:
                    6px;
            }


            .message-bubble {

              max-width: 84% !important;

             padding: 4px 7px 4px 7px !important;

            font-size: 14px !important;

             line-height: 18px !important;
           }


            .attach-button,
            .send-button {

                width:
                    46px;

                height:
                    46px;

                min-width:
                    46px;
            }


            .message-input {

                min-height:
                    46px;
            }
        }


        /* =====================================================
           TABLET
        ===================================================== */

        @media (min-width: 700px) {

            .chat-app {

                max-width:
                    760px;

                margin:
                    auto;

                box-shadow:
                    0 0 30px
                    rgba(0,0,0,.08);
            }


            .messages-container {

                padding-left:
                    18px;

                padding-right:
                    18px;
            }


            .message-bubble {

                max-width:
                    65% !important;
            }
        }

    </style>

</head>


<body>


<div class="chat-app">


    <!-- =====================================================
         HEADER
    ===================================================== -->

    <header class="chat-header">


        <!-- BACK BUTTON -->

        <button
            id="backBtn"
            class="header-button"
            type="button"
            aria-label="Go back"
        >

            <svg
                class="back-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.3"
                stroke-linecap="round"
                stroke-linejoin="round"
            >

                <path d="M19 12H5"></path>

                <path d="M12 19L5 12L12 5"></path>

            </svg>

        </button>


        <!-- =================================================
             USER HEADER
        ================================================= -->

        <div
            id="chatUserArea"
            class="chat-user"
        >


            <div class="chat-avatar-wrap">


                <div
                    id="chatAvatar"
                    class="chat-avatar"
                >
                    ?
                </div>


                <span
                    id="chatStatusDot"
                    class="chat-online-dot"
                ></span>


            </div>


            <div class="chat-user-info">


                <div
                    class="chat-user-name-row"
                >

                    <strong
                        id="chatUserName"
                    >
                        Loading...
                    </strong>

                </div>


                <div
                    class="chat-status"
                >

                    <span
                        id="chatStatusText"
                    >
                        Loading...
                    </span>

                </div>


            </div>


        </div>


        <!-- =================================================
             MENU / PROFILE
        ================================================= -->

        <button
            id="profileBtn"
            type="button"
            aria-label="Open profile"
        >

            <span class="dots">

                <span></span>
                <span></span>
                <span></span>

            </span>

        </button>


    </header>



    <!-- =====================================================
         MESSAGES
    ===================================================== -->

    <main
        id="messagesContainer"
        class="messages-container"
        aria-live="polite"
    >


        <div
            class="chat-loading"
        >

            <span
                class="loading-spinner"
            ></span>

            Loading conversation...

        </div>


    </main>



    <!-- =====================================================
         MESSAGE COMPOSER
    ===================================================== -->

    <form
        id="messageForm"
        class="message-composer"
        autocomplete="off"
    >

    <div
    id="photoUploadStatus"
    class="photo-upload-status"
    role="status"
    aria-live="polite"
></div>


<div
    id="photoPreview"
    class="photo-preview"
>

    <img
        id="photoPreviewImage"
        src=""
        alt="Selected photo"
    >

    <div class="photo-preview-info">

        <div
            id="photoPreviewTitle"
            class="photo-preview-title"
        >
            Photo selected
        </div>

        <div
            id="photoPreviewSize"
            class="photo-preview-size"
        >
            Ready to send
        </div>

    </div>

    <button
        id="photoPreviewCancel"
        class="photo-preview-cancel"
        type="button"
        aria-label="Cancel photo"
    >
        ×
    </button>

</div>


        <!-- =================================================
             ATTACHMENT
        ================================================= -->

        <button
    id="attachButton"
    class="attach-button"
    type="button"
    aria-label="Send photo"
    title="Send photo"
>

    <svg
        class="attach-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
    >

        <rect
            x="3"
            y="3"
            width="18"
            height="18"
            rx="3"
        ></rect>

        <circle
            cx="8.5"
            cy="8.5"
            r="1.5"
        ></circle>

        <path
            d="M21 15l-5-5L5 21"
        ></path>

    </svg>

</button>


<!-- =================================================
     PHOTO INPUT
================================================= -->

<input
    id="photoInput"
    type="file"
    accept="image/jpeg,image/png,image/webp"
    hidden
>



        <!-- =================================================
             INPUT
        ================================================= -->

        <div
            class="input-wrapper"
        >


            <span
                class="input-label"
            >
                Type a message...
            </span>


            <textarea
                id="messageInput"
                class="message-input"
                rows="1"
                maxlength="2000"
                placeholder="Type a message..."
                aria-label="Type a message"
            ></textarea>


        </div>



        <!-- =================================================
             SEND
        ================================================= -->

        <button
            id="sendButton"
            class="send-button"
            type="submit"
            aria-label="Send message"
        >


            <svg
                class="send-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >

                <path
                    d="M22 2L11 13"
                ></path>

                <path
                    d="M22 2L15 22L11 13L2 9L22 2Z"
                ></path>

            </svg>


        </button>


    </form>


</div>



<!-- =========================================================
     CONNECTA CHAT JAVASCRIPT
========================================================= -->

<script
    type="module"
    src="js/chat.js"
></script>


</body>

    </html>
