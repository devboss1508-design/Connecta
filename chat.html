<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#22c55e"
  >

  <title>Chat — CONNECTA</title>

  <link rel="stylesheet" href="css/main.css">

  <style>

    /* ========================================
       CONNECTA CHAT PAGE
    ======================================== */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7faf7;
    }

    .chat-page {
      min-height: 100vh;
      height: 100vh;

      display: flex;
      flex-direction: column;

      background: #f7faf7;
    }


    /* ========================================
       HEADER
    ======================================== */

    .chat-header {
      height: 64px;

      flex-shrink: 0;

      background: var(--primary);
      color: #fff;

      display: flex;
      align-items: center;

      padding: 0 12px;

      gap: 9px;

      box-shadow:
        0 3px 12px rgba(21,128,61,.18);

      z-index: 10;
    }


    .chat-back {
      width: 42px;
      height: 42px;

      border: 0;

      background: transparent;

      color: #fff;

      font-size: 28px;

      border-radius: 12px;

      display: grid;
      place-items: center;

      cursor: pointer;

      flex-shrink: 0;
    }

    .chat-back:active {
      background: rgba(255,255,255,.15);
    }


    /* ========================================
       USER AVATAR
    ======================================== */

    .chat-user-avatar {
      width: 42px;
      height: 42px;

      border-radius: 50%;

      background: #baf0ca;

      color: #08752f;

      display: grid;
      place-items: center;

      font-size: 15px;
      font-weight: 900;

      overflow: hidden;

      border: 2px solid rgba(255,255,255,.75);

      flex-shrink: 0;
    }

    .chat-user-avatar img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }


    /* ========================================
       USER INFORMATION
    ======================================== */

    .chat-user-info {
      min-width: 0;

      flex: 1;
    }

    .chat-user-name {
      font-size: 15px;

      font-weight: 900;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .chat-user-status {
      display: flex;

      align-items: center;

      gap: 5px;

      margin-top: 2px;

      font-size: 10px;
    }

    .chat-status-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;
    }

    .chat-status-dot.online {
      background: #bbf7d0;
    }

    .chat-status-dot.offline {
      background: #d1d5db;
    }

    .chat-status-online {
      color: #dcfce7;
    }

    .chat-status-offline {
      color: #e5e7eb;
    }


    /* ========================================
       HEADER ACTION
    ======================================== */

    .chat-header-action {
      width: 40px;
      height: 40px;

      border: 0;

      background: transparent;

      color: #fff;

      font-size: 22px;

      border-radius: 12px;

      cursor: pointer;
    }


    /* ========================================
       MESSAGES AREA
    ======================================== */

    .messages-container {
      flex: 1;

      overflow-y: auto;

      padding: 16px 12px 12px;

      display: flex;

      flex-direction: column;

      gap: 8px;

      scroll-behavior: smooth;
    }


    /* ========================================
       DATE / EMPTY
    ======================================== */

    .chat-empty {
      margin: auto;

      text-align: center;

      color: #8a928d;

      font-size: 13px;

      padding: 30px;
    }

    .chat-empty-icon {
      width: 58px;
      height: 58px;

      border-radius: 50%;

      margin: 0 auto 10px;

      background: #e7f9eb;

      color: var(--primary-dark);

      display: grid;
      place-items: center;

      font-size: 25px;
    }


    /* ========================================
       MESSAGE ROW
    ======================================== */

    .message-row {
      display: flex;

      width: 100%;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .message-row.theirs {
      justify-content: flex-start;
    }


    /* ========================================
       MESSAGE BUBBLE
    ======================================== */

    .message-bubble {
      max-width: 78%;

      padding: 9px 12px;

      border-radius: 17px;

      font-size: 13px;

      line-height: 1.4;

      word-wrap: break-word;

      white-space: pre-wrap;
    }

    .message-row.mine .message-bubble {
      background: var(--primary);

      color: #fff;

      border-bottom-right-radius: 5px;
    }

    .message-row.theirs .message-bubble {
      background: #fff;

      color: #1f2937;

      border: 1px solid #e3e9e4;

      border-bottom-left-radius: 5px;

      box-shadow:
        0 2px 6px rgba(0,0,0,.03);
    }


    /* ========================================
       MESSAGE META
    ======================================== */

    .message-meta {
      display: flex;

      justify-content: flex-end;

      align-items: center;

      gap: 5px;

      margin-top: 3px;

      font-size: 9px;
    }

    .message-row.mine .message-meta {
      color: rgba(255,255,255,.75);
    }

    .message-row.theirs .message-meta {
      color: #9ca3af;
    }


    /* ========================================
       COMPOSER
    ======================================== */

    .chat-composer {
      flex-shrink: 0;

      background: #fff;

      border-top: 1px solid #dfe7e1;

      padding:
        8px
        9px
        calc(8px + env(safe-area-inset-bottom));

      display: flex;

      align-items: flex-end;

      gap: 7px;
    }


    .composer-input-wrap {
      flex: 1;

      display: flex;

      align-items: flex-end;

      background: #f4f7f5;

      border: 1px solid #dfe7e1;

      border-radius: 22px;

      min-height: 44px;

      padding: 0 12px;
    }


    #messageInput {
      width: 100%;

      border: 0;

      outline: 0;

      background: transparent;

      resize: none;

      font-family: inherit;

      font-size: 13px;

      line-height: 20px;

      padding: 11px 0;

      max-height: 100px;
    }


    #messageInput::placeholder {
      color: #9ca3af;
    }


    .send-button {
      width: 45px;
      height: 45px;

      flex-shrink: 0;

      border: 0;

      border-radius: 50%;

      background: var(--primary);

      color: #fff;

      font-size: 19px;

      display: grid;
      place-items: center;

      cursor: pointer;

      box-shadow:
        0 3px 10px rgba(34,197,94,.25);
    }

    .send-button:active {
      transform: scale(.94);
    }

    .send-button:disabled {
      opacity: .55;

      cursor: not-allowed;
    }


    /* ========================================
       LOADING
    ======================================== */

    .chat-loading {
      margin: auto;

      color: #7b847f;

      font-size: 13px;
    }


    /* ========================================
       BLOCKED / ERROR
    ======================================== */

    .chat-error {
      margin: auto;

      max-width: 330px;

      text-align: center;

      color: #b42318;

      background: #fff;

      border: 1px solid #f0d5d5;

      border-radius: 17px;

      padding: 20px;

      font-size: 13px;
    }


    /* ========================================
       DESKTOP
    ======================================== */

    @media (min-width: 700px) {

      .chat-page {
        max-width: 700px;

        margin: 0 auto;

        border-left: 1px solid #e1e9e3;
        border-right: 1px solid #e1e9e3;
      }

      .messages-container {
        padding-left: 20px;
        padding-right: 20px;
      }

      .chat-composer {
        padding-left: 20px;
        padding-right: 20px;
      }

    }

  </style>

</head>


<body>

  <main class="chat-page">


    <!-- ======================================
         CHAT HEADER
    ======================================= -->

    <header class="chat-header">

      <button
        id="backBtn"
        class="chat-back"
        type="button"
        aria-label="Go back"
      >
        ←
      </button>


      <div
        id="chatAvatar"
        class="chat-user-avatar"
      >
        U
      </div>


      <div class="chat-user-info">

        <div
          id="chatUserName"
          class="chat-user-name"
        >
          Loading...
        </div>


        <div
          id="chatUserStatus"
          class="chat-user-status chat-status-offline"
        >

          <span
            id="chatStatusDot"
            class="chat-status-dot offline"
          ></span>

          <span id="chatStatusText">
            Offline
          </span>

        </div>

      </div>


      <button
        id="profileBtn"
        class="chat-header-action"
        type="button"
        aria-label="View profile"
      >
        ⋮
      </button>

    </header>


    <!-- ======================================
         MESSAGES
    ======================================= -->

    <section
      id="messagesContainer"
      class="messages-container"
      aria-live="polite"
    >

      <div class="chat-loading">
        Loading conversation...
      </div>

    </section>


    <!-- ======================================
         MESSAGE COMPOSER
    ======================================= -->

    <form
      id="messageForm"
      class="chat-composer"
    >

      <div class="composer-input-wrap">

        <textarea
          id="messageInput"
          rows="1"
          maxlength="2000"
          placeholder="Type a message..."
          autocomplete="off"
        ></textarea>

      </div>


      <button
        id="sendButton"
        class="send-button"
        type="submit"
        aria-label="Send message"
      >
        ➤
      </button>

    </form>


  </main>


  <script
    type="module"
    src="js/chat.js"
  ></script>

</body>

  </html>
