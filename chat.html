<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Chat • CONNECTA</title>


    <style>

/* =========================================================
   CONNECTA CHAT — COMPLETE COMPACT STYLE
   ========================================================= */

:root {
    --connecta-green: #22c55e;
    --connecta-green-dark: #16a34a;
    --connecta-green-light: #dcfce7;

    --page-bg: #f4f8f5;

    --white: #ffffff;

    --text: #18221c;
    --muted: #7b857e;

    --border: #e3e9e5;

    --incoming-bg: #ffffff;
    --outgoing-bg: #22c55e;

    --blue-read: #42a5f5;

    --header-height: 72px;
    --composer-height: 76px;
}


/* =========================================================
   RESET
   ========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


html,
body {
    width: 100%;
    height: 100%;
}


body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    background: var(--page-bg);

    color: var(--text);

    overflow: hidden;

    -webkit-font-smoothing: antialiased;
}


button,
textarea {
    font: inherit;
}


button {
    border: 0;
    cursor: pointer;
}


/* =========================================================
   APP
   ========================================================= */

.chat-app {
    width: 100%;
    height: 100dvh;

    display: flex;
    flex-direction: column;

    overflow: hidden;

    background: var(--page-bg);
}


/* =========================================================
   HEADER
   ========================================================= */

.chat-header {
    width: 100%;

    height: var(--header-height);
    min-height: var(--header-height);

    display: flex;
    align-items: center;

    padding: 0 8px;

    background:
        linear-gradient(
            135deg,
            #22c55e,
            #1bc45c
        );

    color: #ffffff;

    box-shadow:
        0 2px 8px rgba(0, 0, 0, .12);

    position: relative;

    z-index: 20;
}


/* =========================================================
   BACK BUTTON
   ========================================================= */

.header-button {
    width: 44px;
    height: 44px;

    min-width: 44px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: transparent;

    color: #ffffff;
}


.header-button:active {
    background: rgba(255,255,255,.16);
}


.back-icon {
    width: 28px;
    height: 28px;
}


/* =========================================================
   CHAT USER
   ========================================================= */

.chat-user {
    min-width: 0;

    flex: 1;

    height: 100%;

    display: flex;
    align-items: center;

    margin-left: 2px;

    cursor: pointer;
}


/* =========================================================
   AVATAR
   ========================================================= */

.chat-avatar-wrap {
    width: 48px;
    height: 48px;

    min-width: 48px;

    position: relative;

    margin-right: 10px;
}


.chat-avatar {
    width: 48px;
    height: 48px;

    border-radius: 50%;

    background: #ffffff;

    color: var(--connecta-green-dark);

    border:
        2px solid rgba(255,255,255,.8);

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 16px;
    font-weight: 800;

    overflow: hidden;
}


.chat-avatar img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}


/* =========================================================
   ONLINE DOT
   ========================================================= */

.chat-online-dot {
    position: absolute;

    right: -1px;
    bottom: 0;

    width: 15px;
    height: 15px;

    border-radius: 50%;

    background: #ffffff;

    display: none;

    align-items: center;
    justify-content: center;

    box-shadow:
        0 1px 3px rgba(0,0,0,.18);
}


.chat-online-dot::after {
    content: "";

    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #18c866;
}


/* =========================================================
   USER INFO
   ========================================================= */

.chat-user-info {
    min-width: 0;

    display: flex;
    flex-direction: column;

    justify-content: center;
}


.chat-user-name-row {
    min-width: 0;

    display: flex;
    align-items: center;

    gap: 5px;
}


#chatUserName {
    max-width: 230px;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;

    font-size: 17px;

    font-weight: 700;

    line-height: 21px;
}


/* =========================================================
   VERIFIED BADGE
   ========================================================= */

.verified-badge {
    width: 17px;
    height: 17px;

    min-width: 17px;

    border-radius: 50%;

    background: #1d9bf0;

    color: #ffffff;

    display: inline-flex;

    align-items: center;
    justify-content: center;

    font-size: 10px;

    font-weight: 900;

    line-height: 1;
}


/* =========================================================
   STATUS
   ========================================================= */

.chat-status {
    height: 18px;

    display: flex;
    align-items: center;

    min-width: 0;

    color: rgba(255,255,255,.92);

    font-size: 12px;

    line-height: 16px;
}


#chatStatusText {
    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}


/* =========================================================
   TYPING
   ========================================================= */

.typing-status {
    display: inline-flex;

    align-items: center;

    gap: 3px;

    color: #ffffff;
}


.typing-label {
    font-weight: 600;

    margin-right: 2px;
}


.typing-dot {
    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: #ffffff;

    animation:
        typingBounce 1.2s infinite ease-in-out;
}


.typing-dot:nth-child(2) {
    animation-delay: .15s;
}


.typing-dot:nth-child(3) {
    animation-delay: .3s;
}


@keyframes typingBounce {

    0%,
    60%,
    100% {
        transform: translateY(0);
        opacity: .55;
    }

    30% {
        transform: translateY(-3px);
        opacity: 1;
    }
}


/* =========================================================
   THREE-DOT MENU
   ========================================================= */

#profileBtn {
    width: 44px;
    height: 44px;

    min-width: 44px;

    border-radius: 50%;

    background: transparent;

    color: #ffffff;

    display: flex;
    align-items: center;
    justify-content: center;
}


#profileBtn:active {
    background: rgba(255,255,255,.16);
}


.dots {
    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 3px;
}


.dots span {
    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: #ffffff;
}


/* =========================================================
   MESSAGES AREA
   ========================================================= */

.messages-container {
    flex: 1;

    min-height: 0;

    overflow-y: auto;
    overflow-x: hidden;

    padding:
        10px
        8px
        12px;

    background:
        radial-gradient(
            circle at top,
            rgba(34,197,94,.035),
            transparent 40%
        ),
        var(--page-bg);

    -webkit-overflow-scrolling: touch;

    scroll-behavior: smooth;
}


.messages-container::-webkit-scrollbar {
    width: 3px;
}


.messages-container::-webkit-scrollbar-track {
    background: transparent;
}


.messages-container::-webkit-scrollbar-thumb {
    background: rgba(34,197,94,.22);

    border-radius: 20px;
}


/* =========================================================
   DATE SEPARATOR
   ========================================================= */

.date-separator {
    display: flex;

    align-items: center;
    justify-content: center;

    margin:
        7px 0
        10px;
}


.date-separator span {
    padding:
        4px 11px;

    border-radius: 15px;

    background: #e8efea;

    color: #707a73;

    font-size: 10px;

    font-weight: 600;
}


/* =========================================================
   ⭐ IMPORTANT MESSAGE ROW
   This prevents the bubble from stretching vertically.
   ========================================================= */

.message-row {
    width: 100%;

    display: flex;

    align-items: flex-start !important;

    height: auto !important;

    min-height: 0 !important;

    margin:
        0 0 3px 0;

    padding: 0;

    flex: 0 0 auto !important;
}


.message-row.incoming {
    justify-content: flex-start;
}


.message-row.outgoing {
    justify-content: flex-end;
}


/* =========================================================
   ⭐ COMPACT MESSAGE BUBBLE
   ========================================================= */

.message-bubble {
    display: block;

    width: auto !important;

    max-width: 72%;

    min-width: 0 !important;

    min-height: 0 !important;

    height: auto !important;

    padding:
        5px 8px 3px;

    margin: 0;

    border-radius: 13px;

    font-size: 14px;

    line-height: 18px;

    word-break: break-word;

    overflow-wrap: anywhere;

    box-shadow:
        0 1px 3px rgba(0,0,0,.06);

    flex: 0 0 auto !important;
}


/* =========================================================
   INCOMING
   ========================================================= */

.incoming .message-bubble {
    background: var(--incoming-bg);

    color: #202821;

    border:
        1px solid #e7ece8;

    border-top-left-radius: 4px;
}


/* =========================================================
   OUTGOING
   ========================================================= */

.outgoing .message-bubble {
    background:
        linear-gradient(
            135deg,
            #22c55e,
            #19bd5b
        );

    color: #ffffff;

    border-top-right-radius: 4px;

    box-shadow:
        0 1px 4px rgba(34,197,94,.16);
}


/* =========================================================
   MESSAGE TEXT
   ========================================================= */

.message-text {
    display: block;

    width: auto;

    height: auto;

    min-height: 0;

    margin: 0;

    padding: 0;

    white-space: pre-wrap;

    line-height: 18px;

    font-size: 14px;
}


/* =========================================================
   MESSAGE META
   ========================================================= */

.message-meta {
    display: flex;

    align-items: center;

    justify-content: flex-end;

    width: 100%;

    height: auto;

    min-height: 9px;

    margin:
        1px 0 0;

    padding: 0;

    gap: 3px;

    font-size: 8px;

    line-height: 9px;

    user-select: none;
}


.incoming .message-meta {
    color: #a0a8a3;
}


.outgoing .message-meta {
    color: rgba(255,255,255,.82);
}


/* =========================================================
   MESSAGE CHECKS
   ========================================================= */

.message-checks {
    display: inline-flex;

    align-items: center;

    width: auto;

    height: 10px;

    min-height: 0;

    padding: 0;

    margin: 0;

    font-size: 10px;

    line-height: 10px;

    font-weight: 700;

    letter-spacing: -2px;

    color: rgba(255,255,255,.88);
}


.message-checks.read {
    color: var(--blue-read);
}


/* =========================================================
   EMPTY CHAT
   ========================================================= */

.empty-chat {
    min-height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 30px 20px;
}


.empty-chat-card {
    max-width: 280px;

    padding:
        20px 18px;

    border-radius: 18px;

    background: rgba(255,255,255,.9);

    border:
        1px solid var(--border);

    box-shadow:
        0 2px 12px rgba(0,0,0,.05);
}


.empty-chat-icon {
    width: 50px;
    height: 50px;

    margin:
        0 auto 10px;

    border-radius: 50%;

    background: var(--connecta-green-light);

    color: var(--connecta-green-dark);

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 22px;
}


.empty-chat-card h3 {
    font-size: 15px;

    margin-bottom: 5px;
}


.empty-chat-card p {
    color: var(--muted);

    font-size: 12px;

    line-height: 18px;
}


/* =========================================================
   COMPOSER
   ========================================================= */

.message-composer {
    width: 100%;

    min-height: var(--composer-height);

    padding:
        8px
        9px
        calc(8px + env(safe-area-inset-bottom));

    display: flex;

    align-items: flex-end;

    gap: 8px;

    background:
        rgba(255,255,255,.98);

    border-top:
        1px solid var(--border);

    box-shadow:
        0 -2px 10px rgba(0,0,0,.035);

    position: relative;

    z-index: 20;
}


/* =========================================================
   ATTACH BUTTON
   ========================================================= */

.attach-button {
    width: 50px;
    height: 50px;

    min-width: 50px;

    border-radius: 9px;

    background: #eef2ef;

    color: var(--connecta-green-dark);

    display: flex;

    align-items: center;
    justify-content: center;
}


.attach-button:active {
    transform: scale(.93);
}


.attach-icon {
    width: 24px;
    height: 24px;
}


/* =========================================================
   INPUT WRAPPER
   ========================================================= */

.input-wrapper {
    flex: 1;

    min-width: 0;

    position: relative;

    display: flex;

    align-items: center;
}


/* =========================================================
   MESSAGE INPUT
   ========================================================= */

.message-input {
    width: 100%;

    min-height: 50px;

    max-height: 110px;

    resize: none;

    overflow-y: auto;

    padding:
        13px 14px;

    border:
        2px solid var(--connecta-green);

    border-radius: 9px;

    background: #ffffff;

    color: var(--text);

    outline: none;

    font-size: 14px;

    line-height: 18px;
}


.message-input:focus {
    box-shadow:
        0 0 0 3px
        rgba(34,197,94,.1);
}


.message-input::placeholder {
    color: transparent;
}


.message-input::-webkit-scrollbar {
    width: 3px;
}


.message-input::-webkit-scrollbar-thumb {
    background: #bac7be;

    border-radius: 20px;
}


/* =========================================================
   INPUT LABEL
   ========================================================= */

.input-label {
    position: absolute;

    left: 12px;

    top: -8px;

    padding:
        0 6px;

    background: #ffffff;

    color: var(--connecta-green-dark);

    font-size: 13px;

    font-weight: 600;

    pointer-events: none;
}


/* =========================================================
   SEND BUTTON
   ========================================================= */

.send-button {
    width: 50px;
    height: 50px;

    min-width: 50px;

    border-radius: 9px;

    background:
        linear-gradient(
            135deg,
            #22c55e,
            #16b957
        );

    color: #ffffff;

    display: flex;

    align-items: center;
    justify-content: center;

    box-shadow:
        0 3px 8px rgba(34,197,94,.2);
}


.send-button:active {
    transform: scale(.92);
}


.send-button:disabled {
    opacity: .55;

    box-shadow: none;
}


.send-icon {
    width: 26px;
    height: 26px;
}


/* =========================================================
   LOADING
   ========================================================= */

.chat-loading {
    min-height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    color: var(--muted);

    font-size: 13px;
}


.loading-spinner {
    width: 22px;
    height: 22px;

    margin-right: 8px;

    border:
        3px solid #dce6df;

    border-top-color:
        var(--connecta-green);

    border-radius: 50%;

    animation:
        spin .8s linear infinite;
}


@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}


/* =========================================================
   SMALL PHONES
   ========================================================= */

@media (max-width: 380px) {

    .chat-avatar-wrap,
    .chat-avatar {
        width: 44px;
        height: 44px;
    }


    .chat-avatar-wrap {
        min-width: 44px;

        margin-right: 8px;
    }


    #chatUserName {
        max-width: 175px;

        font-size: 16px;
    }


    .messages-container {
        padding:
            8px
            6px
            10px;
    }


    .message-bubble {
        max-width: 78%;

        font-size: 14px;

        padding:
            5px 8px 3px;
    }


    .message-text {
        font-size: 14px;

        line-height: 18px;
    }


    .attach-button,
    .send-button {
        width: 46px;
        height: 46px;

        min-width: 46px;
    }


    .message-input {
        min-height: 46px;
    }
}


/* =========================================================
   TABLET
   ========================================================= */

@media (min-width: 700px) {

    .chat-app {
        max-width: 760px;

        margin: auto;

        box-shadow:
            0 0 30px rgba(0,0,0,.08);
    }


    .messages-container {
        padding-left: 18px;
        padding-right: 18px;
    }


    .message-bubble {
        max-width: 65%;
    }
}

    </style>
</head>


<body>


<div class="chat-app">


    <!-- =====================================================
         HEADER
    ===================================================== -->

    <header class="chat-header">


        <!-- BACK -->

        <button
            id="backBtn"
            class="header-button"
            type="button"
            aria-label="Go back"
        >

            <svg
                class="back-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.3"
                stroke-linecap="round"
                stroke-linejoin="round"
            >

                <path d="M19 12H5"></path>

                <path d="M12 19L5 12L12 5"></path>

            </svg>

        </button>


        <!-- USER -->

        <div
            id="chatUserArea"
            class="chat-user"
        >


            <div class="chat-avatar-wrap">

                <div
                    id="chatAvatar"
                    class="chat-avatar"
                >
                    ?
                </div>


                <span
                    id="chatStatusDot"
                    class="chat-online-dot"
                ></span>

            </div>


            <div class="chat-user-info">


                <div class="chat-user-name-row">

                    <strong id="chatUserName">
                        Loading...
                    </strong>

                </div>


                <div class="chat-status">

                    <span id="chatStatusText">
                        Loading...
                    </span>

                </div>

            </div>

        </div>


        <!-- MENU -->

        <button
            id="profileBtn"
            type="button"
            aria-label="Open profile"
        >

            <span class="dots">

                <span></span>
                <span></span>
                <span></span>

            </span>

        </button>

    </header>



    <!-- =====================================================
         MESSAGES
    ===================================================== -->

    <main
        id="messagesContainer"
        class="messages-container"
        aria-live="polite"
    >

        <div class="chat-loading">

            <span class="loading-spinner"></span>

            Loading conversation...

        </div>

    </main>



    <!-- =====================================================
         COMPOSER
    ===================================================== -->

    <form
        id="messageForm"
        class="message-composer"
        autocomplete="off"
    >


        <!-- ATTACHMENT -->

        <button
            id="attachButton"
            class="attach-button"
            type="button"
            aria-label="Attach"
        >

            <svg
                class="attach-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >

                <path
                    d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"
                ></path>

            </svg>

        </button>



        <!-- INPUT -->

        <div class="input-wrapper">

            <span class="input-label">
                Type a message...
            </span>


            <textarea
                id="messageInput"
                class="message-input"
                rows="1"
                maxlength="2000"
                placeholder="Type a message..."
                aria-label="Type a message"
            ></textarea>

        </div>



        <!-- SEND -->

        <button
            id="sendButton"
            class="send-button"
            type="submit"
            aria-label="Send message"
        >

            <svg
                class="send-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >

                <path d="M22 2L11 13"></path>

                <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>

            </svg>

        </button>

    </form>

</div>



<script
    type="module"
    src="js/chat.js"
></script>


</body>
    </html>
